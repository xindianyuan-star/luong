const b64=b=>{let s='';const u=new Uint8Array(b);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)},ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function pack(obj,pw){const gz=await new Response(new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();if(!pw)return{v:1,enc:0,d:b64(gz)};const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await dkey(pw,salt),gz);return{v:1,enc:1,s:b64(salt),i:b64(iv),d:b64(ct)}}
async function unpack(p,pw){let buf=ub64(p.d);if(p.enc){if(!pw)throw Error('File được mã hóa, cần nhập mật khẩu');try{buf=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(p.i)},await dkey(pw,ub64(p.s)),buf))}catch(e){throw Error('Sai mật khẩu hoặc file hỏng')}}return JSON.parse(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text())}
